<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Prévia animada do painel de metas e sortimento (dados fictícios)">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07201b"/><stop offset="1" stop-color="#0f3f33"/></linearGradient>
<linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#7fe0a8"/><stop offset="1" stop-color="#e4f26f"/></linearGradient>
<style>
text{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;fill:#e9f5ef}
.m{fill:#8db3a5}.y{fill:#e4f26f}
@keyframes ring{0%{stroke-dashoffset:439.8}35%,90%{stroke-dashoffset:194.4}100%{stroke-dashoffset:439.8}}
@keyframes draw{0%{stroke-dashoffset:1}40%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
@keyframes fade{0%,38%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
@keyframes bar{0%{transform:scaleX(0)}40%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes pop{0%,30%{opacity:0;transform:translateY(8px)}45%,90%{opacity:1;transform:translateY(0)}100%{opacity:0}}
.ring{stroke-dasharray:439.8;animation:ring 8s ease-in-out infinite}
.ln{stroke-dasharray:1;animation:draw 8s ease-in-out infinite}
.pj{animation:fade 8s ease-in-out infinite}
.bar{transform-box:fill-box;transform-origin:left;animation:bar 8s ease-out infinite}
.pop{animation:pop 8s ease-out infinite}
</style>
</defs>
<rect width="900" height="400" rx="16" fill="url(#bg)"/>
<rect x="0" y="0" width="900" height="46" rx="16" fill="#0a2923"/><rect x="0" y="30" width="900" height="16" fill="#0a2923"/>
<rect x="0" y="43" width="900" height="3" fill="#e4f26f"/>
<rect x="20" y="10" width="26" height="26" rx="7" fill="url(#ac)"/><text x="26" y="29" font-size="13" font-weight="800" style="fill:#07201b">DM</text>
<text x="58" y="29" font-size="15" font-weight="700" class="y">Painel de Metas</text>
<text x="880" y="28" font-size="11" text-anchor="end" class="m">DEMO · DADOS FICTÍCIOS</text>
<circle cx="130" cy="190" r="70" fill="none" stroke="#1b463c" stroke-width="18"/>
<circle class="ring" cx="130" cy="190" r="70" fill="none" stroke="url(#ac)" stroke-width="18" stroke-linecap="round" transform="rotate(-90 130 190)"/>
<text x="130" y="198" font-size="30" font-weight="800" text-anchor="middle">55,8%</text>
<text x="130" y="218" font-size="11" text-anchor="middle" class="m">da meta do mês</text>
<text x="250" y="82" font-size="11" class="m" letter-spacing="2">TIME EXEMPLO · FARMA</text>
<text x="250" y="122" font-size="38" font-weight="800">R$ 1.004.400</text>
<text x="540" y="122" font-size="14" class="m">de R$ 1.800.000</text>
<g class="pop"><rect x="690" y="98" width="150" height="26" rx="13" fill="#1b8a4d"/><text x="765" y="116" font-size="12" font-weight="700" text-anchor="middle">Tende a bater a meta</text></g>
<line x1="250" y1="300" x2="860" y2="300" stroke="#1f4a40"/><line x1="250" y1="250" x2="860" y2="250" stroke="#1f4a40"/><line x1="250" y1="200" x2="860" y2="200" stroke="#1f4a40"/><line x1="250" y1="150" x2="860" y2="150" stroke="#1f4a40"/>
<path d="M250 292 C330 290 380 270 470 250 S560 215 640 205 S760 180 860 160" fill="none" stroke="#8db3a5" stroke-width="2" stroke-dasharray="6 5"/>
<path class="ln" pathLength="1" d="M250 300 L290 296 L330 296 L370 280 L410 262 L450 248 L490 228 L530 205" fill="none" stroke="#e4f26f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path class="pj" d="M530 205 L860 140" fill="none" stroke="#e4f26f" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
<text class="pj m" x="860" y="132" font-size="11" text-anchor="end" style="fill:#e4f26f">projeção 2,5 mi</text>
<text x="250" y="330" font-size="11" class="m">1</text><text x="550" y="330" font-size="11" class="m">10</text><text x="855" y="330" font-size="11" class="m">20</text>
<text x="40" y="318" font-size="11" class="m">SORTIMENTO</text>
<rect x="40" y="328" width="190" height="10" rx="5" fill="#1b463c"/><rect class="bar" x="40" y="328" width="82" height="10" rx="5" fill="url(#ac)"/>
<text x="40" y="360" font-size="11" class="m">COBERTURA</text>
<rect x="40" y="368" width="190" height="10" rx="5" fill="#1b463c"/><rect class="bar" x="40" y="368" width="116" height="10" rx="5" fill="url(#ac)" style="animation-delay:.2s"/>
<g class="pop" style="animation-delay:.3s"><text x="250" y="365" font-size="11" class="m">FALTA</text><text x="250" y="385" font-size="16" font-weight="700">R$ 795.600</text>
<text x="420" y="365" font-size="11" class="m">POR DIA ÚTIL</text><text x="420" y="385" font-size="16" font-weight="700">R$ 66.300</text>
<text x="600" y="365" font-size="11" class="m">PROJEÇÃO</text><text x="600" y="385" font-size="16" font-weight="700" class="y">139,5% da meta</text></g>
</svg>
