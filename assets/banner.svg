<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Luiz Zonato — Gestor comercial que constrói as próprias ferramentas">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07201b"/><stop offset="1" stop-color="#10503f"/></linearGradient>
<linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#7fe0a8"/><stop offset="1" stop-color="#e4f26f"/></linearGradient>
<clipPath id="cp"><rect width="1000" height="240" rx="14"/></clipPath>
<style>
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-500px)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.7}}
.w1{animation:wave 14s linear infinite}.w2{animation:wave 9s linear infinite}
.t1{animation:up .9s .2s both}.t2{animation:up .9s .6s both}.t3{animation:up .9s 1s both}
.b{transform-box:fill-box;transform-origin:bottom;animation:grow 3.6s ease-in-out infinite}
.dot{animation:pulse 3s ease-in-out infinite}
text{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
</style>
</defs>
<g clip-path="url(#cp)">
<rect width="1000" height="240" fill="url(#bg)"/>
<circle class="dot" cx="880" cy="40" r="70" fill="#e4f26f" opacity=".12"/>
<circle class="dot" cx="120" cy="230" r="90" fill="#7fe0a8" opacity=".12" style="animation-delay:1.2s"/>
<g class="w1" opacity=".35"><path d="M0 196 q125 -34 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V240 H0Z" fill="#7fe0a8"/></g>
<g class="w2" opacity=".55"><path d="M0 210 q125 -26 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V240 H0Z" fill="#0b2f27"/></g>
<g fill="url(#ac)">
<rect class="b" x="770" y="90" width="26" height="90" rx="5" style="animation-delay:0s"/>
<rect class="b" x="810" y="70" width="26" height="110" rx="5" style="animation-delay:.4s"/>
<rect class="b" x="850" y="105" width="26" height="75" rx="5" style="animation-delay:.8s"/>
<rect class="b" x="890" y="55" width="26" height="125" rx="5" style="animation-delay:1.2s"/>
</g>
<text class="t1" x="60" y="108" font-size="66" font-weight="800" fill="url(#ac)">Luiz Zonato</text>
<text class="t2" x="62" y="148" font-size="24" fill="#e9f5ef">Gestor comercial que constrói as próprias ferramentas</text>
<text class="t3" x="62" y="180" font-size="14" letter-spacing="3" fill="#8db3a5">VENDAS  ·  DADOS  ·  AUTOMAÇÃO COM IA</text>
</g>
</svg>
